<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Word Castle ・ smartkidsgame</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="canonical" href="https://smartkidsgame.com/games/castle-defense/">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:"PingFang HK","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif; background:#7ec8e3; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; }
  .screen.show { display:flex; }

  #homeBtn { position:fixed; top:1.8vmin; left:1.8vmin; z-index:120;
    width:8.5vmin; height:8.5vmin; border-radius:50%; background:#fffef0; border:.6vmin solid #5b4a32;
    display:flex; align-items:center; justify-content:center; font-size:4.6vmin; line-height:1;
    text-decoration:none; box-shadow:0 .7vmin 0 rgba(0,0,0,.3); }
  #homeBtn:active { transform:translateY(.4vmin); box-shadow:0 .3vmin 0 rgba(0,0,0,.3); }

  /* 品牌標誌（開場）*/
  .brandMini { position:absolute; top:3.4vmin; left:50%; transform:translateX(-50%); z-index:6;
    display:flex; align-items:center; gap:1.6vmin; font-family:'Baloo 2',sans-serif;
    background:rgba(255,255,255,.92); padding:1.3vmin 3vmin 1.3vmin 1.5vmin; border-radius:50vmax;
    box-shadow:0 .8vmin 0 rgba(0,0,0,.12); }
  .brandMini .bb { width:min(10vmin,54px); height:min(10vmin,54px); border-radius:2.6vmin;
    background:#ffb02e; box-shadow:0 .5vmin 0 #e8901a; display:flex; align-items:center; justify-content:center; flex:none; }
  .brandMini .bb svg { width:74%; height:74%; }
  .brandMini .bw { display:flex; flex-direction:column; align-items:flex-start; line-height:1; }
  .brandMini .bw .ln { font-weight:800; font-size:min(4.8vmin,26px); }
  .brandMini .bw .s1 { color:#2f9fd6; } .brandMini .bw .s2 { color:#f59e0b; }
  .brandMini .bw .gm { font-weight:700; font-size:min(2.1vmin,12px); letter-spacing:.26em; color:#fff;
    background:#5fbf3f; border-radius:50vmax; padding:.2vmin 1.4vmin .3vmin 2vmin; margin-top:.7vmin; }

  /* ===== 開始畫面 ===== */
  #startScreen { background:linear-gradient(#aee7ff 0%,#d8f4ff 52%,#b9e8a0 52%,#8fd470 100%);
    align-items:center; justify-content:center; gap:3.5vmin; }
  #startHero { width:52vmin; height:50vmin; }
  #startHero svg { width:100%; height:100%; overflow:visible; }
  .logo { font-family:'Baloo 2',sans-serif; font-size:12.5vmin; font-weight:800; color:#fff; letter-spacing:.3vmin;
    text-shadow:0 1vmin 0 #f59e0b, 0 1.6vmin 2vmin rgba(0,0,0,.25); }
  #playBtn { border:none; cursor:pointer; font-size:8vmin; line-height:1; padding-left:1vmin;
    width:21vmin; height:21vmin; border-radius:50%; color:#fff;
    background:radial-gradient(circle at 35% 30%,#ffd86b,#f59e0b);
    box-shadow:0 1.4vmin 0 #c47b06; animation:pulse 1.2s ease-in-out infinite; }
  #playBtn:active { transform:translateY(.8vmin); box-shadow:0 .6vmin 0 #c47b06; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }

  /* ===== 遊戲畫面 ===== */
  #gameScreen { background:#7ec8e3; }
  #hud { flex:0 0 auto; display:flex; align-items:center; gap:2vmin; padding:2vmin 2vmin 1.4vmin 12vmin;
    background:#fff7e0; box-shadow:0 .5vmin 0 rgba(0,0,0,.08); z-index:40; }
  #lvBadge { font-size:3.6vmin; font-weight:900; color:#fff; background:#8e6bc9; border-radius:50vmax;
    padding:.8vmin 2.6vmin; box-shadow:0 .5vmin 0 #6a4a9e; white-space:nowrap; }
  #wallBox { flex:1; display:flex; align-items:center; gap:1.2vmin; min-width:0; }
  #wallBox .ic { font-size:4.6vmin; line-height:1; }
  .wb { flex:1; height:3.6vmin; background:#d8cbb0; border:.5vmin solid #5b4a32; border-radius:2vmin; overflow:hidden; }
  .wb i { display:block; height:100%; width:100%; background:linear-gradient(#8be78b,#2eaf5a); border-radius:1.4vmin;
    transition:width .35s ease, background .35s; }
  .wb i.low { background:linear-gradient(#ff8a8a,#d62b2b); }
  #monLeft { font-size:3.6vmin; font-weight:900; color:#5b4a32; background:#fff; border-radius:50vmax;
    padding:.8vmin 2.4vmin; box-shadow:0 .4vmin 0 rgba(0,0,0,.12); white-space:nowrap; }

  #arena { flex:1; position:relative; overflow:hidden; }
  #deco { position:absolute; inset:0; pointer-events:none; }
  #ground { position:absolute; left:0; right:0; bottom:0; height:18%; }

  /* 關卡場景 */
  #arena.st0 { background:linear-gradient(#aee7ff 0%,#d8f4ff 60%,#c9f0a8 60%,#a8e07f 100%); }
  #arena.st0 #ground { background:linear-gradient(#7cc95b,#5da53f); border-top:.8vmin solid #9fdb7e; }
  #arena.st1 { background:linear-gradient(#bfe6a8 0%,#d9f2c2 55%,#7fbf68 55%,#5da34a 100%); }
  #arena.st1 #deco { background:
      radial-gradient(circle at 20% 50% ,#3c7a3c 0 7vmin,transparent 7.4vmin),
      radial-gradient(circle at 45% 46%,#4f9344 0 9vmin,transparent 9.5vmin),
      radial-gradient(circle at 72% 50%,#3c7a3c 0 6vmin,transparent 6.4vmin),
      radial-gradient(circle at 92% 47%,#4f9344 0 8vmin,transparent 8.5vmin); opacity:.5; }
  #arena.st1 #ground { background:linear-gradient(#4f9344,#3c7a2e); border-top:.8vmin solid #79b968; }
  #arena.st2 { background:linear-gradient(#ff9d57 0%,#ffd49a 46%,#ffc07a 58%,#e8bd72 58%,#d8a95c 100%); }
  #arena.st2 #deco { background:radial-gradient(circle at 76% 30%,#fff2c8 0 6vmin,#ffd86b 6vmin 8vmin,transparent 8.4vmin); }
  #arena.st2 #ground { background:linear-gradient(#d8b36a,#bd9448); border-top:.8vmin solid #ecd090; }
  #arena.st3 { background:linear-gradient(#cfe3f5 0%,#eef7ff 58%,#dcebf8 58%,#c3d8ec 100%); }
  #arena.st3 #deco::before, #arena.st3 #deco::after { content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.95) 0 .9vmin, transparent 1.2vmin),
      radial-gradient(circle, rgba(255,255,255,.75) 0 .55vmin, transparent .8vmin);
    background-size: 23vmin 26vmin, 17vmin 21vmin;
    background-position: 0 0, 8vmin 6vmin;
    animation: snowFall1 8s linear infinite; }
  #arena.st3 #deco::after {
    background-size: 31vmin 34vmin, 13vmin 16vmin;
    background-position: 4vmin 2vmin, 1vmin 9vmin;
    opacity:.7; animation: snowFall2 13s linear infinite; }
  @keyframes snowFall1 { to { background-position: 23vmin 26vmin, 25vmin 27vmin; } }
  @keyframes snowFall2 { to { background-position: 35vmin 36vmin, 14vmin 25vmin; } }
  #arena.st3 #ground { background:linear-gradient(#f2f7fc,#cfdff0); border-top:.8vmin solid #fff; }
  #arena.st4 { background:linear-gradient(#141a36 0%,#27315c 62%,#3a3560 62%,#282349 100%); }
  #arena.st4 #deco { background:
      radial-gradient(circle at 82% 16%,#fff7d0 0 4vmin,transparent 4.4vmin),
      radial-gradient(circle at 16% 20%,#fff 0 .6vmin,transparent .9vmin),
      radial-gradient(circle at 38% 10%,#fff 0 .5vmin,transparent .8vmin),
      radial-gradient(circle at 58% 22%,#fff 0 .6vmin,transparent .9vmin),
      radial-gradient(circle at 70% 8%,#fff 0 .4vmin,transparent .7vmin); }
  #arena.st4 #ground { background:linear-gradient(#3a3560,#241f42); border-top:.8vmin solid #5a5390; }
  #arena.st5 { background:linear-gradient(#ff9ec8 0%,#ffce8a 44%,#ffe9b3 58%,#d88ab0 58%,#b06a94 100%); }
  #arena.st5 #deco { background:
      radial-gradient(circle at 72% 34%,#fff7d8 0 7vmin,#ffd86b 7vmin 9vmin,transparent 9.5vmin),
      radial-gradient(circle at 18% 18%,#fff 0 .7vmin,transparent 1vmin),
      radial-gradient(circle at 40% 10%,#fff 0 .5vmin,transparent .8vmin),
      radial-gradient(circle at 88% 12%,#fff 0 .6vmin,transparent .9vmin); opacity:.9; }
  #arena.st5 #ground { background:linear-gradient(#c87aa4,#a05a84); border-top:.8vmin solid #e8a8c8; }

  /* 城堡 */
  #castle { position:absolute; left:0; bottom:16%; width:30vmin; height:60vmin; z-index:20; }
  #castle svg { width:100%; height:100%; overflow:visible; }
  #castle .wgirl { animation:girlBob 1.9s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes girlBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2.5px)} }
  #castle.shake { animation:cShake .45s ease; }
  @keyframes cShake { 20%{transform:translateX(-1.2vmin)} 40%{transform:translateX(1vmin)} 60%{transform:translateX(-.8vmin)} 80%{transform:translateX(.6vmin)} }

  /* 女孩對話框 */
  #bubble { position:absolute; left:20vmin; top:4%; z-index:35;
    background:#fff; border:.8vmin solid #5b4a32; border-radius:5vmin; padding:1.6vmin 3vmin;
    display:flex; align-items:center; gap:1.8vmin; box-shadow:0 1vmin 0 rgba(0,0,0,.25);
    transform:scale(0); transform-origin:8% 110%; transition:transform .3s cubic-bezier(.34,1.56,.64,1); cursor:pointer; }
  #bubble.show { transform:scale(1); }
  #bubble::after { content:""; position:absolute; left:6%; bottom:-3.2vmin; border:1.8vmin solid transparent;
    border-top-color:#5b4a32; border-left-width:1vmin; border-right-width:1vmin; }
  #bubbleWord { font-family:'Baloo 2',sans-serif; font-size:clamp(24px,7.6vmin,64px); font-weight:800; color:#3a4a8a;
    line-height:1; text-transform:lowercase; letter-spacing:.05em; }
  #bubbleWord.long { font-size:clamp(18px,5.4vmin,44px); }
  #speakBtn { border:none; background:#ffe9b3; border-radius:50%; width:6vmin; height:6vmin;
    font-size:3.2vmin; box-shadow:0 .5vmin 0 #d8b96a; pointer-events:none; flex:none; }

  /* 單位 */
  .unit { position:absolute; bottom:16%; transform:translateX(-50%); pointer-events:none; }
  .unit .uhp { width:9vmin; height:1.3vmin; background:rgba(0,0,0,.35); border-radius:1vmin; margin:0 auto .6vmin; overflow:hidden; }
  .unit .uhp i { display:block; height:100%; border-radius:1vmin; transition:width .2s; }
  .unit.ally .uhp i { background:#43d36b; }
  .unit.mon .uhp i { background:#ff5d5d; }
  .unit .ubody { line-height:1; text-align:center; }
  .unit.ally .ubody { animation:walkA .55s ease-in-out infinite; }
  .unit.ally .ubody svg { height:13vmin; width:auto; display:block; margin:0 auto; }
  @keyframes walkA { 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-1.6vmin) rotate(4deg)} }
  .unit.mon .ubody { animation:walkM .7s ease-in-out infinite; }
  @keyframes walkM { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.2vmin)} }
  .unit.mon .ubody svg { display:block; }
  .unit .ubody.atk { animation:atkL .4s ease !important; }
  @keyframes atkL { 40%{transform:translateX(-3.5vmin) scale(1.08)} 100%{transform:translateX(0)} }
  .unit.ally .ubody.atk { animation:atkR .4s ease !important; }
  @keyframes atkR { 40%{transform:translateX(3.5vmin) scale(1.12) rotate(10deg)} 100%{transform:translateX(0)} }
  .unit .ubody.hurt { filter:brightness(1.9) saturate(.3); }
  .unit.dying { animation:die .5s ease forwards; }
  @keyframes die { to{ transform:translateX(-50%) scale(0); opacity:0 } }

  .fx { position:fixed; z-index:60; font-size:7vmin; line-height:1; pointer-events:none; }

  /* 答案掣（四揀一圖案）*/
  #choices { flex:0 0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:2.2vmin; padding:2.2vmin; background:#fff7e0; }
  .choice { border:none; border-radius:3.6vmin; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center;
    padding:1.6vmin 0 2vmin; box-shadow:0 1vmin 0 rgba(0,0,0,.18);
    transition:transform .1s; }
  .choice svg { height:clamp(44px,14.5vmin,130px); width:auto; pointer-events:none; }
  .choice .em { font-size:clamp(40px,12.5vmin,112px); line-height:1.15; pointer-events:none; }
  .choice:nth-child(1){ background:#ffd6d6; } .choice:nth-child(2){ background:#d6e8ff; }
  .choice:nth-child(3){ background:#d9f5d0; } .choice:nth-child(4){ background:#ffedbf; }
  .choice:active { transform:translateY(.7vmin); box-shadow:0 .4vmin 0 rgba(0,0,0,.18); }
  .choice { position:relative; }
  .choice.right { background:#43d36b !important; animation:rp .5s ease 2; }
  @keyframes rp { 50%{transform:scale(1.1)} }
  .choice.wrong { background:#9aa0a6 !important; transform:scale(.94); opacity:.85; }
  .choice.dim { opacity:.25; }
  #choices.locked .choice { pointer-events:none; }
  /* 引導：正確答案發光跳動 */
  .choice.hint { background:#43d36b !important; animation:hintPulse .75s ease-in-out infinite; z-index:3; }
  @keyframes hintPulse {
    0%,100%{ transform:scale(1); box-shadow:0 1vmin 0 rgba(0,0,0,.18), 0 0 0 0 rgba(67,211,107,.8); }
    50%{ transform:scale(1.1); box-shadow:0 1vmin 0 rgba(0,0,0,.18), 0 0 0 2.6vmin rgba(67,211,107,0); } }
  #hintPtr { position:absolute; top:-10vmin; left:50%; z-index:6; font-size:8.5vmin; line-height:1;
    pointer-events:none; filter:drop-shadow(0 .6vmin .6vmin rgba(0,0,0,.3));
    animation:ptrBob .55s ease-in-out infinite; }
  @keyframes ptrBob { 0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,2.2vmin)} }

  /* ===== 過關慶祝 ===== */
  #clearScreen { background:radial-gradient(circle at 50% 30%,#4a3f7a 0%,#2a2450 60%,#181430 100%);
    align-items:center; justify-content:center; gap:3vmin; text-align:center; overflow:hidden; }
  #clearTitle { font-size:9vmin; font-weight:900; color:#ffd34d; text-shadow:0 .8vmin 0 #8e5b24; letter-spacing:.8vmin; z-index:2; }
  #clearSub { font-size:4.6vmin; font-weight:800; color:#fff; opacity:.9; z-index:2; }
  #clearCastle { width:38vmin; height:55vmin; z-index:2; animation:girlPop .6s cubic-bezier(.34,1.56,.64,1); }
  #clearCastle svg { width:100%; height:100%; overflow:visible; }
  @keyframes girlPop { from{ transform:scale(.4); opacity:0 } }
  /* 士兵齊齊慶祝 */
  .partyRow { display:flex; justify-content:center; align-items:flex-end; flex-wrap:wrap;
    gap:1vmin 1.6vmin; max-width:92vmin; z-index:2; }
  .partyGuy { height:13vmin; }
  .partyGuy svg { height:100%; width:auto; }
  .partyGuy { animation:partyJump .72s ease-in-out infinite; }
  .partyGuy:nth-child(2n){ animation-delay:.36s; }
  .partyGuy:nth-child(3n){ animation-duration:.62s; }
  @keyframes partyJump { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-3vmin) rotate(6deg)} }

  #nextBtn { border:none; cursor:pointer; font-size:7vmin; line-height:1; padding-left:.8vmin; z-index:2;
    width:18vmin; height:18vmin; border-radius:50%; color:#fff;
    background:radial-gradient(circle at 35% 30%,#8be78b,#2eaf5a);
    box-shadow:0 1.2vmin 0 #1d7c3d; animation:pulse 1.2s ease-in-out infinite; }
  .fwd { position:absolute; width:1.6vmin; height:1.6vmin; border-radius:50%; pointer-events:none; z-index:1; }

  /* ===== 結算畫面 ===== */
  .endScreen { align-items:center; justify-content:center; gap:3vmin; text-align:center; padding:4vmin; overflow:hidden; }
  #winScreen { background:linear-gradient(#ffe9b3,#ffd86b); }
  #overScreen { background:linear-gradient(#8fb8e8,#5a86c2); }
  #overScreen .endTitle { color:#fff; text-shadow:0 .7vmin 0 rgba(0,0,0,.25); }
  .endEmoji { font-size:19vmin; line-height:1; animation:bobE 1.4s ease-in-out infinite; }
  @keyframes bobE { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2vmin)} }
  .endTitle { font-size:7.4vmin; font-weight:900; color:#4a3a26; letter-spacing:.4vmin; }
  .endSub { font-size:4.4vmin; font-weight:800; color:#6a5a3e; }
  #overScreen .endSub { color:#eef4ff; }
  .endScore { font-size:6.4vmin; font-weight:900; color:#4a3a26; background:rgba(255,255,255,.88);
    border-radius:4vmin; padding:1vmin 5vmin; box-shadow:0 1vmin 0 rgba(0,0,0,.12); }
  #learnedWords { display:flex; flex-wrap:wrap; justify-content:center; gap:1.4vmin; max-width:92vmin; max-height:26vmin; overflow-y:auto; }
  .learnedChip { background:#fff; border-radius:3vmin; padding:.8vmin 2vmin; font-size:4.2vmin; font-weight:800; color:#4a3a26;
    box-shadow:0 .6vmin 0 rgba(0,0,0,.1); text-transform:lowercase; display:flex; align-items:center; gap:1vmin; }
  .learnedChip svg { height:1.6em; width:auto; }
  .endBtn { border:none; cursor:pointer; font-size:8vmin; line-height:1; width:19vmin; height:19vmin; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#8be78b,#2eaf5a); color:#fff;
    box-shadow:0 1.2vmin 0 #1d7c3d; animation:pulse 1.2s ease-in-out infinite; }
  .endBtn:active { transform:translateY(.8vmin); box-shadow:0 .4vmin 0 #1d7c3d; }

  /* ===== 橫向（landscape）排版：兩個方向都完美玩到 ===== */
  @media (orientation:landscape){
    /* 開場 */
    #startHero { width:40vmin; height:38vmin; }
    .logo { font-size:10.5vmin; }
    #playBtn { width:17vmin; height:17vmin; font-size:6.5vmin; }
    /* 遊戲中：城堡窄少少，戰場闊啲 */
    #castle { width:27vmin; height:54vmin; }
    #bubble { left:15vmin; }
    /* 過關畫面：城堡左、文字+按鈕右（兩欄先塞得落）*/
    #clearScreen.show { display:grid; grid-template-columns:40vw 1fr; column-gap:2vw; row-gap:2.2vmin;
      grid-template-areas:"castle title" "castle sub" "castle party" "castle btn";
      align-content:center; align-items:center; justify-items:center; padding:3vmin 5vmin; }
    #clearCastle { grid-area:castle; width:36vmin; height:60vmin; justify-self:end; }
    #clearTitle { grid-area:title; font-size:7.5vmin; }
    #clearSub { grid-area:sub; font-size:4vmin; }
    #clearParty { grid-area:party; max-width:48vw; }
    #nextBtn { grid-area:btn; width:15vmin; height:15vmin; font-size:6vmin; }
    /* 結算畫面：縮細等唔使捲屏 */
    .endScreen { gap:2vmin; }
    .endEmoji { font-size:12vmin; }
    .endTitle { font-size:5.6vmin; }
    .endSub { font-size:3.6vmin; }
    .endScore { font-size:5vmin; padding:.6vmin 4vmin; }
    .partyGuy { height:10vmin; }
    #learnedWords { max-height:19vmin; max-width:120vmin; }
    .endBtn { width:14vmin; height:14vmin; font-size:6vmin; }
  }

  /* ===== 抖一抖（護眼）===== */
  #restScreen { position:fixed; inset:0; z-index:200; display:none; flex-direction:column; align-items:center; justify-content:center; gap:3vmin; color:#fff;
    background:radial-gradient(circle at 50% 32%,#41527f 0%,#28305a 52%,#161a35 100%); text-align:center; overflow:hidden; }
  #restScreen.show { display:flex; }
  #restScreen .star { position:absolute; color:#fff; opacity:.5; font-size:3vmin; animation:twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.2;transform:scale(.8)} 50%{opacity:.9;transform:scale(1.1)} }
  #restMoon { font-size:22vmin; line-height:1; z-index:1; animation:bobE 3.2s ease-in-out infinite; }
  #restTitle { font-size:8vmin; font-weight:900; letter-spacing:1.5vmin; z-index:1; }
  #restSub { font-size:4.2vmin; opacity:.85; z-index:1; }
  #restTimer { font-size:15vmin; font-weight:900; z-index:1; font-variant-numeric:tabular-nums;
    background:rgba(255,255,255,.12); border:.5vmin solid rgba(255,255,255,.25); border-radius:5vmin; padding:.5vmin 6vmin; letter-spacing:.5vmin; }
</style>
</head>
<body>

<a id="homeBtn" href="../../" aria-label="返回首頁">🏠</a>

<!-- 開始畫面 -->

  P.push(`<path d="M33 170 L33 130 Q50 112 67 130 L67 170 Z" fill="#9a8a70" stroke="${edge}" stroke-width="2"/>`);
  P.push(`<path d="M37 170 L37 132 Q50 118 63 132 L63 170 Z" fill="url(#${u}d)" stroke="#4a2c14" stroke-width="2"/>`);
  P.push(`<line x1="50" y1="121" x2="50" y2="168" stroke="#4a2c14" stroke-width="1.8"/>`);
  P.push(`<g fill="#3a2210" opacity=".8"><circle cx="42" cy="138" r="1"/><circle cx="58" cy="138" r="1"/><circle cx="42" cy="152" r="1"/><circle cx="58" cy="152" r="1"/><circle cx="42" cy="164" r="1"/><circle cx="58" cy="164" r="1"/></g>`);
  P.push(`<circle cx="45.5" cy="146" r="2" fill="none" stroke="#e8b93c" stroke-width="1.4"/>`);
  P.push(`<circle cx="54.5" cy="146" r="2" fill="none" stroke="#e8b93c" stroke-width="1.4"/>`);

  // ── 金色閃星（stage>=5 終極城堡）
  if(stage>=5){
    const sp=(x,y,s)=>`<path d="M${x} ${y-s} L${x+s*.35} ${y-s*.35} L${x+s} ${y} L${x+s*.35} ${y+s*.35} L${x} ${y+s} L${x-s*.35} ${y+s*.35} L${x-s} ${y} L${x-s*.35} ${y-s*.35} Z" fill="#ffd34d" stroke="#c8922a" stroke-width=".7"/>`;
    P.push(sp(14,30,4), sp(88,38,3.2), sp(24,58,2.6), sp(80,20,4.4));
  }
  // ── 女孩（企喺最高層城齒後面）
  const gy = stage>=2 ? keepTop-1 : wallTop-9;
  P.push(`<g transform="translate(50 ${gy})">${girlOnWallSVG()}</g>`);
  P.push(`</svg>`);
  return P.join("");
}
function heroSceneSVG(){
  // 開場圖：城堡 + 怪物迫近
  return `<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(10 -8) scale(.82)">${castleSVG(1).replace(/<\/?svg[^>]*>/g,"")}</g>
    <g transform="translate(130 96) scale(.42)">${monsterSVG(1).replace(/<\/?svg[^>]*>/g,"")}</g>
    <g transform="translate(164 102) scale(.34)">${monsterSVG(0).replace(/<\/?svg[^>]*>/g,"")}</g>
    <text x="120" y="42" font-size="17" font-family="Arial,sans-serif" font-weight="900" fill="#fff" stroke="#3a4a8a" stroke-width="0" opacity=".0">.</text>
  </svg>`;
}

/* ================= 聲音 ================= */
let actx=null;
function audioInit(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==="suspended") actx.resume(); }
function tone(f,t0,dur,type="sine",vol=.25){ if(!actx) return; const o=actx.createOscillator(),g=actx.createGain();
  o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,actx.currentTime+t0); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t0+dur);
  o.connect(g).connect(actx.destination); o.start(actx.currentTime+t0); o.stop(actx.currentTime+t0+dur+.05); }
const sfx = {
  ask(){ tone(660,0,.12); tone(880,.1,.16); },
  right(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.16,"triangle",.3)); },
  wrong(){ tone(200,0,.3,"sawtooth",.18); tone(150,.12,.3,"sawtooth",.18); },
  pop(){ tone(420,0,.1,"triangle",.3); tone(640,.06,.12,"triangle",.3); },
  clash(){ tone(160,0,.12,"square",.26); tone(90,.04,.16,"square",.24); },
  wallHit(){ tone(110,0,.2,"square",.32); tone(70,.08,.26,"square",.3); },
  die(){ tone(500,0,.1,"triangle",.26); tone(300,.08,.14,"triangle",.22); },
  fw(){ tone(880,0,.08,"triangle",.2); tone(1320,.1,.24,"sine",.16); },
  win(){ [523,523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.13,.22,"triangle",.3)); },
  lose(){ [400,330,260,200].forEach((f,i)=>tone(f,i*.2,.3,"sine",.25)); },
};

/* ================= 語音（英文女聲，扮小女孩）================= */
let enVoice=null;
const GIRL_NAMES=/samantha|karen|martha|kate|serena|tessa|moira|flo|shelley|sandy|nicky|allison|ava|susan|zoe|female/i;
function pickVoice(){ const vs=speechSynthesis.getVoices();
  const en=vs.filter(v=>/^en/i.test(v.lang));
  enVoice = en.find(v=>GIRL_NAMES.test(v.name) && /GB/i.test(v.lang))
         || en.find(v=>GIRL_NAMES.test(v.name))
         || en.find(v=>/en[-_]GB/i.test(v.lang))
         || en[0] || null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speakEn(text){ if(!("speechSynthesis" in window)) return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="en-GB"; u.rate=.78; u.pitch=1.35; if(enVoice) u.voice=enVoice; speechSynthesis.speak(u); }

/* ================= 關卡設定 ================= */
const LEVELS = [
  { seq:[0,0,1,0,1,0,1,0,1],                  interval:5800, wall:12 },
  { seq:[0,1,0,1,0,2,0,1,2,0,2],              interval:5200, wall:13 },
  { seq:[1,0,2,1,0,2,1,2,0,2,1,2],            interval:4800, wall:13 },
  { seq:[1,2,1,3,2,1,2,3,2,1,3,2,3],          interval:4400, wall:14 },
  { seq:[2,1,3,2,3,1,2,3,2,4,2,3,3,4],        interval:4000, wall:14 },
  { seq:[2,3,2,3,4,2,3,3,4,2,3,4,3,4,4],      interval:3600, wall:16 },
];
const ALLY = { hp:9, atk:3, spd:6.4, cd:550 };
const MON_CD = 900, WALL_CD = 1400;

/* ================= 遊戲狀態 ================= */
const S = {
  level:0, wallHp:10, wallMax:10,
  allies:[], mons:[], spawnQueue:[], nextSpawnAt:0, spawnedAll:false,
  word:null, icon:null, queue:[], learned:new Map(), soldiers:[],
  running:false, busy:false, lastFrame:0, loopId:null,
};
window.S = S;   // debug

function showScreen(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("show")); $(id).classList.add("show"); }

/* vmin → arena% 換算 */
function vminPct(){ const ar=$("arena"); const vm=Math.min(window.innerWidth,window.innerHeight)/100;
  return vm/Math.max(1,ar.offsetWidth)*100; }
function wallX(){ const c=$("castle"), ar=$("arena"); return (c.offsetLeft+c.offsetWidth*.88)/Math.max(1,ar.offsetWidth)*100; }

/* ================= HUD ================= */
function renderHud(){
  $("lvBadge").textContent = "Level "+(S.level+1);
  const pct = Math.max(0,S.wallHp/S.wallMax*100);
  const f=$("wallFill"); f.style.width=pct+"%"; f.classList.toggle("low",pct<=35);
  const left = S.spawnQueue.length + S.mons.filter(m=>!m.dead).length;
  $("monLeft").textContent = "👾 ×"+left;
}

/* ================= 單位 ================= */
function mkUnit(cls, inner, x, hpMax){
  const el=document.createElement("div"); el.className="unit "+cls;
  el.innerHTML = `<div class="uhp"><i style="width:100%"></i></div><div class="ubody">${inner}</div>`;
  el.style.left=x+"%";
  $("units").appendChild(el);
  return el;
}
function setHpBar(u){ const i=u.el.querySelector(".uhp i"); if(i) i.style.width=Math.max(0,u.hp/u.hpMax*100)+"%"; }
function flashAtk(u, right){ const b=u.el.querySelector(".ubody");
  b.classList.remove("atk"); void b.offsetWidth; b.classList.add("atk"); }
function flashHurt(u){ const b=u.el.querySelector(".ubody");
  b.classList.add("hurt"); setTimeout(()=>b.classList.remove("hurt"),180); }
function burstAt(el, emoji, n=6){
  const r=el.getBoundingClientRect();
  for(let i=0;i<n;i++){ const d=document.createElement("div"); d.className="fx"; d.textContent=emoji;
    d.style.left=(r.left+r.width/2)+"px"; d.style.top=(r.top+r.height/2)+"px"; document.body.appendChild(d);
    const ang=Math.PI*2*i/n, dpx=8+Math.random()*7;
    d.animate([{transform:"translate(0,0) scale(.6)",opacity:1},{transform:`translate(${Math.cos(ang)*dpx}vmin,${Math.sin(ang)*dpx}vmin) scale(1.15)`,opacity:0}],{duration:650,easing:"ease-out"});
    setTimeout(()=>d.remove(),800); }
}
function killUnit(u){
  u.dead=true; u.el.classList.add("dying"); sfx.die();
  burstAt(u.el, u.isMon ? "⭐" : "💨", u.isMon?6:4);
  setTimeout(()=>u.el.remove(),520);
}

function spawnMonster(t){
  const v=MTYPE[t], lv=S.level;
  const hp = Math.round(v.hp*(1+lv*.10));
  const u = { isMon:true, type:t, x:104, hp, hpMax:hp, atk:v.atk, spd:v.spd*(0.85+Math.random()*.3),
    size:v.size, nextHit:0, dead:false, el:null };
  u.el = mkUnit("mon", monsterSVG(t), u.x, hp);
  u.el.querySelector(".ubody").style.width = v.size+"vmin";
  u.el.querySelector(".ubody").style.animationDuration = (0.5+ (6-v.spd)*0.1)+"s";
  S.mons.push(u); renderHud();
  return u;
}
function spawnAlly(icon){
  const u = { isMon:false, x: wallX()-1.5, hp:ALLY.hp+S.level, hpMax:ALLY.hp+S.level, atk:ALLY.atk, spd:ALLY.spd,
    nextHit:0, dead:false, el:null };
  u.el = mkUnit("ally", icon, u.x, u.hp);
  u.el.animate([{transform:"translateX(-50%) scale(0)"},{transform:"translateX(-50%) scale(1)"}],{duration:280,easing:"cubic-bezier(.34,1.56,.64,1)"});
  sfx.pop();
  S.allies.push(u);
  return u;
}

/* ================= 主循環 ================= */
function tick(){
  if(!S.running) return;
  const now=Date.now();
  let dt=(now-S.lastFrame)/1000; S.lastFrame=now;
  if(dt<=0) return; if(dt>1.5) dt=1.5;
  const VP=vminPct(), wx=wallX();

  // 生怪
  if(S.spawnQueue.length && now>=S.nextSpawnAt){
    spawnMonster(S.spawnQueue.shift());
    const lv=LEVELS[S.level];
    S.nextSpawnAt = now + lv.interval*(0.75+Math.random()*.5);
    if(!S.spawnQueue.length) S.spawnedAll=true;
  }

  const liveM = S.mons.filter(m=>!m.dead);
  const liveA = S.allies.filter(a=>!a.dead);

  // 我方單位
  for(const a of liveA){
    const tgt = liveM.filter(m=>m.x>a.x-3).sort((p,q)=>p.x-q.x)[0];
    const cd = tgt ? (4 + tgt.size/2)*VP*0.9 : 0;
    if(tgt && tgt.x-a.x <= cd){
      if(now>=a.nextHit){ a.nextHit=now+ALLY.cd; flashAtk(a);
        setTimeout(()=>{ if(tgt.dead) return; tgt.hp-=a.atk; setHpBar(tgt); flashHurt(tgt); sfx.clash();
          if(tgt.hp<=0){ killUnit(tgt); renderHud(); } },160); }
    } else {
      a.x += a.spd*VP*dt;
      if(a.x>94) a.x=94;
    }
    a.el.style.left=a.x+"%"; a.el.style.zIndex=Math.round(300-a.x);
  }

  // 怪物
  for(const m of liveM){
    if(m.dead) continue;
    const front = (4 + m.size/2)*VP*0.9;
    const tgt = liveA.filter(a=>a.x<m.x+2).sort((p,q)=>q.x-p.x)[0];
    if(tgt && m.x-tgt.x <= front){
      if(now>=m.nextHit){ m.nextHit=now+MON_CD; flashAtk(m);
        setTimeout(()=>{ if(tgt.dead) return; tgt.hp-=m.atk; setHpBar(tgt); flashHurt(tgt); sfx.clash();
          if(tgt.hp<=0) killUnit(tgt); },160); }
    } else if(m.x - m.size*VP*0.32 <= wx){
      if(now>=m.nextHit){ m.nextHit=now+WALL_CD; flashAtk(m);
        setTimeout(()=>{ S.wallHp-=m.atk; renderHud(); sfx.wallHit();
          const c=$("castle"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
          burstAt(c,"💥",3);
          if(S.wallHp<=0) defeat(); },200); }
    } else {
      m.x -= m.spd*VP*dt;
    }
    m.el.style.left=m.x+"%"; m.el.style.zIndex=Math.round(300-m.x);
  }

  // 過關檢查
  if(S.spawnedAll && !S.spawnQueue.length && liveM.length===0 && S.running){
    levelClear();
  }
}

/* ================= 問答 ================= */
function nextQuestion(){
  if(!S.running) return;
  clearGuided();
  if(S.queue.length===0) S.queue=shuffle(BANK[S.level]);
  const [word,icon]=S.queue.shift();
  S.word=word; S.icon=icon;
  const bw=$("bubbleWord");
  bw.textContent=word;
  bw.classList.toggle("long", word.length>7);
  $("bubble").classList.remove("show"); void $("bubble").offsetWidth; $("bubble").classList.add("show");
  sfx.ask(); speakEn(wantPhrase(word));
  const others = shuffle(BANK[S.level].filter(p=>p[0]!==word)).slice(0,3);
  const opts = shuffle([[word,icon],...others]);
  document.querySelectorAll(".choice").forEach((b,i)=>{ b.innerHTML=picHTML(opts[i][0]); b.dataset.word=opts[i][0]; b.className="choice"; });
  $("choices").classList.remove("locked");
  S.busy=false;
}

function clearGuided(){
  S.guided=false;
  const p=$("hintPtr"); if(p) p.remove();
  document.querySelectorAll(".choice").forEach(b=>{ b.style.pointerEvents=""; });
}
async function answer(btn){
  if(S.busy || !S.running) return;
  const picked=btn.dataset.word;
  const correct = picked===S.word;
  if(S.guided && !correct) return;   // 引導中只接受正確答案
  S.busy=true; $("choices").classList.add("locked");
  const buttons=[...document.querySelectorAll(".choice")];
  const rightBtn=buttons.find(b=>b.dataset.word===S.word);

  if(correct){
    clearGuided();
    btn.classList.remove("hint");
    btn.classList.add("right"); buttons.forEach(b=>{ if(b!==btn) b.classList.add("dim"); });
    sfx.right(); speakEn(S.word);
    S.learned.set(S.word,S.icon);
    if(!S.soldiers.includes(S.word)) S.soldiers.push(S.word);
    spawnAlly(S.icon);
    await wait(700);
    nextQuestion();
  } else {
    btn.classList.add("wrong");
    buttons.forEach(b=>{ if(b!==btn && b!==rightBtn) b.classList.add("dim"); });
    sfx.wrong();
    await wait(300);
    speakEn(itIsPhrase(picked));   // 講解揀錯嗰個係咩
    await wait(1500);
    if(!S.running) return;
    // 引導糾正：正確答案發光跳動 + 手指指住，等小朋友撳
    rightBtn.classList.add("hint");
    const p=document.createElement("div"); p.id="hintPtr"; p.textContent="👇"; rightBtn.appendChild(p);
    buttons.forEach(b=>{ if(b!==rightBtn) b.style.pointerEvents="none"; });
    speakEn(wantPhrase(S.word));
    S.guided=true; S.busy=false;
    $("choices").classList.remove("locked");
  }
}

/* ================= 關卡流程 ================= */
function clearUnits(){
  S.allies.forEach(a=>a.el&&a.el.remove()); S.mons.forEach(m=>m.el&&m.el.remove());
  S.allies=[]; S.mons=[];
}
function startLevel(i){
  S.level=i;
  const lv=LEVELS[i];
  S.wallMax=lv.wall; S.wallHp=lv.wall;
  clearUnits();
  S.spawnQueue=lv.seq.slice(); S.spawnedAll=false;
  S.queue=shuffle(BANK[i]);
  S.soldiers=[];
  S.busy=false;
  const ar=$("arena"); ar.className=""; ar.classList.add("st"+i);
  $("castle").innerHTML=castleSVG(i);
  $("bubble").classList.remove("show");
  $("choices").classList.add("locked");
  document.querySelectorAll(".choice").forEach(b=>{ b.textContent=""; b.className="choice"; });
  renderHud();
  showScreen("gameScreen");
  S.running=true; S.lastFrame=Date.now();
  S.nextSpawnAt=Date.now()+2600;
  if(S.loopId) clearInterval(S.loopId);
  S.loopId=setInterval(tick,100);
  setTimeout(()=>{ if(S.running) nextQuestion(); },900);
}

function stopLevel(){
  S.running=false;
  if(S.loopId){ clearInterval(S.loopId); S.loopId=null; }
}

/* 煙花 */
let fwTimer=null;
function fireworksOn(container){
  const colors=["#ff5d73","#ffd34d","#7ec8f5","#8be78b","#c9a3f0","#ff9d57"];
  function burst(){
    if(!container.closest(".show")) return;
    const x=10+Math.random()*80, y=8+Math.random()*40;
    sfx.fw();
    for(let i=0;i<14;i++){
      const d=document.createElement("div"); d.className="fwd";
      d.style.left=x+"%"; d.style.top=y+"%"; d.style.background=colors[Math.floor(Math.random()*colors.length)];
      container.appendChild(d);
      const ang=Math.PI*2*i/14, r=6+Math.random()*9;
      d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(ang)*r}vmin,${Math.sin(ang)*r+3}vmin) scale(.3)`,opacity:0}],{duration:1000,easing:"ease-out"});
      setTimeout(()=>d.remove(),1100);
    }
  }
  burst(); setTimeout(burst,400);
  fwTimer=setInterval(burst,1100);
}
function fireworksOff(){ if(fwTimer){ clearInterval(fwTimer); fwTimer=null; } }

async function levelClear(){
  stopLevel();
  $("bubble").classList.remove("show");
  sfx.win();
  await wait(500);
  if(S.level>=LEVELS.length-1){ showWin(); return; }
  $("clearTitle").textContent="Level "+(S.level+1)+" clear!";
  $("clearCastle").innerHTML=castleSVG(S.level+1);
  $("clearParty").innerHTML=S.soldiers.map(w=>`<div class="partyGuy">${ICONS[w]}</div>`).join("");
  showScreen("clearScreen");
  speakEn("Well done! The castle is upgraded!");
  fireworksOn($("clearScreen"));
}

function showWin(){
  $("winScore").textContent="★ "+S.learned.size+" words";
  $("winParty").innerHTML=S.soldiers.map(w=>`<div class="partyGuy">${ICONS[w]}</div>`).join("");
  const box=$("learnedWords"); box.innerHTML="";
  S.learned.forEach((icon,word)=>{ const c=document.createElement("div"); c.className="learnedChip";
    c.innerHTML=picHTML(word)+"<span>"+word+"</span>"; c.addEventListener("click",()=>speakEn(word)); box.appendChild(c); });
  showScreen("winScreen");
  sfx.win(); speakEn("Amazing! You saved the castle! You are a hero!");
  fireworksOn($("winScreen"));
}

function defeat(){
  if(!S.running) return;
  stopLevel();
  $("bubble").classList.remove("show");
  sfx.lose();
  setTimeout(()=>{ showScreen("overScreen"); speakEn("So close! Try again, you can do it!"); },600);
}

function newGame(){
  fireworksOff();
  S.learned=new Map();
  engaged=true; lastTick=Date.now();
  startLevel(0);
}

/* ================= 遊玩時間限制（全平台共用）================= */
const LIMIT_PLAY=10*60*1000, LIMIT_REST=10*60*1000;
const IDLE_RESET=10*60*1000;   // 停玩超過此時間 → 眼睛已休息，重新計時
let playMs=0, restUntil=0, lastTick=0, engaged=false, lastActive=0;
try { playMs=Number(localStorage.getItem("wg_playMs"))||0; restUntil=Number(localStorage.getItem("wg_restUntil"))||0; lastActive=Number(localStorage.getItem("wg_lastActive"))||0; }catch(e){}
function maybeResetIdle(){ if(inRest()) return; if(playMs>0 && lastActive && (Date.now()-lastActive)>=IDLE_RESET){ playMs=0; try{localStorage.setItem("wg_playMs","0");}catch(e){} } }
function fmtTime(ms){ const s=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function inRest(){ return restUntil>Date.now(); }
function enterRest(){ try{speechSynthesis.cancel();}catch(e){} stopLevel(); $("restScreen").classList.add("show"); $("restTimer").textContent=fmtTime(restUntil-Date.now());
  speakEn("Time for a break! Close your eyes and rest. See you soon!"); }
function endRest(){ $("restScreen").classList.remove("show"); playMs=0; restUntil=0; lastTick=0; engaged=false;
  try{localStorage.setItem("wg_playMs","0"); localStorage.removeItem("wg_restUntil");}catch(e){} showScreen("startScreen"); }
function timeTick(){
  const now=Date.now();
  if(inRest()){ if(!$("restScreen").classList.contains("show")) enterRest(); $("restTimer").textContent=fmtTime(restUntil-now); return; }
  if($("restScreen").classList.contains("show")){ endRest(); return; }
  if(engaged && document.visibilityState==="visible"){
    if(lastTick) playMs+=now-lastTick; lastTick=now; lastActive=now;
    try{localStorage.setItem("wg_playMs",String(playMs)); localStorage.setItem("wg_lastActive",String(now));}catch(e){}
    if(playMs>=LIMIT_PLAY){ restUntil=now+LIMIT_REST; try{localStorage.setItem("wg_restUntil",String(restUntil));}catch(e){} enterRest(); }
  } else { lastTick=now; }
}
setInterval(timeTick,1000);
document.addEventListener("visibilitychange", ()=>{ lastTick=0; if(document.visibilityState==="visible") maybeResetIdle(); });
maybeResetIdle();
if(inRest()) enterRest();

/* ================= 事件 ================= */
$("startHero").innerHTML=heroSceneSVG();
$("playBtn").addEventListener("click", ()=>{ if(inRest()) return; audioInit(); newGame(); });
$("againBtn").addEventListener("click", ()=>{ if(inRest()) return; audioInit(); fireworksOff(); newGame(); });
$("retryBtn").addEventListener("click", ()=>{ if(inRest()) return; audioInit(); startLevel(S.level); });  // 重試同一關
$("nextBtn").addEventListener("click", ()=>{ if(inRest()) return; audioInit(); fireworksOff(); startLevel(S.level+1); });
$("bubble").addEventListener("click", ()=>{ if(S.word) speakEn(wantPhrase(S.word)); });
document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click", ()=>answer(b)));
document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("contextmenu", e=>e.preventDefault());
window.G={S,tick,spawnMonster,spawnAlly,startLevel,nextQuestion,LEVELS,BANK};   // debug
